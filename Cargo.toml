[workspace]
resolver = "2"
members = [
    "crates/jamsil-common",
    "crates/jamsil-ipc",
    "crates/jamsil-observability",
    "crates/jamsil-sql",
    "crates/jamsil-storage",
    "crates/jamsil-protocol",
    "crates/jamsil-consensus",
    "crates/jamsil-search-engine",
    "bin/jamsild",
    "bin/jamsil-sql",
    "bin/jamsil-store",
    "bin/jamsil-sync",
    "bin/jamsil-search",
    "bin/jamsil-log",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.lints.clippy]
# DbError는 SQLSTATE·상세·힌트를 담는 의도적으로 큰 오류 타입이다.
result_large_err = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
jamsil-common = { path = "crates/jamsil-common" }
jamsil-ipc = { path = "crates/jamsil-ipc" }
jamsil-observability = { path = "crates/jamsil-observability" }
jamsil-sql = { path = "crates/jamsil-sql" }
jamsil-storage = { path = "crates/jamsil-storage" }
jamsil-protocol = { path = "crates/jamsil-protocol" }
jamsil-consensus = { path = "crates/jamsil-consensus" }
jamsil-search-engine = { path = "crates/jamsil-search-engine" }

tokio = { version = "1.47", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
bincode = "1.3.3"
thiserror = "1"
anyhow = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
crc32fast = "1.4"
libc = "0.2"
bytes = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
rusqlite = { version = "0.32", features = ["bundled", "session", "functions", "hooks", "limits", "backup"] }
sqlparser = { version = "0.52", features = ["visitor"] }
tantivy = "0.24"
lindera = { version = "0.44.1", features = ["ko-dic"] }
lindera-tantivy = { version = "0.44.1", features = ["ko-dic"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
regex = "1"
parking_lot = "0.12"

[profile.release]
debug = 1
incremental = true

# 배포용 (RPM): LTO 최적화
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 4
incremental = false
